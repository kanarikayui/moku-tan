<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>統計 — moku-tan</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <p class="app-title">moku-tan</p>
      <nav class="app-nav" aria-label="画面切り替え">
        <a href="./index.html" data-nav>出題</a>
        <a href="./stats.html" data-nav>統計</a>
        <a href="./settings.html" data-nav>設定</a>
      </nav>
    </header>

    <main class="page">
      <h1>統計</h1>
      <p id="notice" class="notice" role="status" hidden></p>

      <section class="card">
        <h2>通算</h2>
        <ul class="summary-grid" id="summary"></ul>
      </section>

      <section class="card">
        <h2>出題方向別</h2>
        <div class="table-scroll"><table id="by-direction"></table></div>
      </section>

      <section class="card">
        <h2>直近 30 日</h2>
        <ul class="daily-chart" id="daily-chart"></ul>
        <div class="daily-axis"><span id="daily-from"></span><span id="daily-to"></span></div>
        <p class="empty" id="daily-note"></p>
      </section>

      <section class="card">
        <h2>難易度別</h2>
        <div class="table-scroll"><table id="by-level"></table></div>
      </section>

      <section class="card">
        <h2>種別</h2>
        <div class="table-scroll"><table id="by-type"></table></div>
      </section>

      <section class="card">
        <h2>分野・パート別</h2>
        <div class="table-scroll"><table id="by-tag"></table></div>
      </section>

      <section class="card">
        <h2>苦手な語（出題 3 回以上）</h2>
        <div class="table-scroll"><table id="weak"></table></div>
      </section>

      <section class="card">
        <h2>学習カバレッジ</h2>
        <p id="coverage"></p>
      </section>
    </main>

    <script type="module" src="./js/stats-page.js"></script>
  </body>
</html>
